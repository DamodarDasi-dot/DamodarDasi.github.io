<svg xmlns="http://www.w3.org/2000/svg" class="ly" viewBox="0 0 1000 560" role="img" aria-labelledby="lyc05-t lyc05-d"><title id="lyc05-t">Steam-turbine-driven air compressor package, plan view (illustrative)</title><desc id="lyc05-d">Filter-silencer house and large inlet duct feeding a three-stage integrally geared air compressor in an acoustic enclosure on an elevated deck, driven by a customer-supplied steam turbine, with water-cooled intercoolers below the deck and a lube-oil console with overhead rundown tank.</desc><style>
