<svg xmlns="http://www.w3.org/2000/svg" class="pid" viewBox="0 0 1120 640" role="img" aria-labelledby="c4l-t c4l-d"><title id="c4l-t">Typical shared lube-oil system for the BAC and ETB (illustrative)</title><style>.pid{display:block;width:100%;height:auto;background:#071018}
