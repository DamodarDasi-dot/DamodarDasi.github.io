</style><desc id="c4l-d">An oil tank with two electric heaters, level and temperature transmitters and a motorised oil demister feeds a gear-driven main oil pump and a motor-driven auxiliary oil pump through strainers and check valves. A pressure control valve spills excess oil back to the tank. Oil passes twin water-cooled oil coolers and twin filters with differential pressure indication, then a supply header feeds the BAC gearbox, the ETB gearbox and the common motor bearings through orifices. Oil drains back to the tank. The MAC has an identical stand-alone system.</desc><defs><marker id="c4la" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22D3EE"/></marker><marker id="c4lb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A5B4FC"/></marker><marker id="c4lo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F59E0B"/></marker><marker id="c4lg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker></defs><rect x="6" y="6" width="1108" height="628" class="fr"/><rect x="20" y="20" width="1080" height="600" class="fr"/><text x="110" y="16" class="zn">1</text><text x="290" y="16" class="zn">2</text><text x="470" y="16" class="zn">3</text><text x="650" y="16" class="zn">4</text><text x="830" y="16" class="zn">5</text><text x="1010" y="16" class="zn">6</text><text x="11" y="95" class="zn">A</text><text x="11" y="245" class="zn">B</text><text x="11" y="395" class="zn">C</text><text x="11" y="545" class="zn">D</text><rect x="60" y="300" width="230" height="130" class="eq"/><text x="175" y="324" class="tg">OIL TANK</text><path d="M80 400h10l5-9 6 18 6-18 6 18 5-9h10" class="ln"/><path d="M170 400h10l5-9 6 18 6-18 6 18 5-9h10" class="ln"/><text x="175" y="422" class="tgs">2 × electric heaters</text><path d="M110 300L110 270" class="tap"/><circle cx="110" cy="270" r="14" class="ib"/><path d="M96 270h28" class="ln"/><text x="110" y="267" class="it">LT</text><text x="110" y="280" class="it">401</text><path d="M250 430L250 460" class="tap"/><circle cx="250" cy="460" r="14" class="ib"/><path d="M236 460h28" class="ln"/><text x="250" y="457" class="it">TT</text><text x="250" y="470" class="it">401</text><path d="M150 300V250" class="vt"/><rect x="132" y="214" width="36" height="36" class="eq"/><text x="150" y="236" class="it">DEM</text><circle cx="182" cy="232" r="9" class="eq"/><text x="182" y="235" class="it">M</text><path d="M150 214V130" class="vt" marker-end="url(#c4lg)"/><text x="162" y="140" class="lbs">oil demister · vent</text><path d="M290 360H337M290 410H310V470H337" class="lo"/><path d="M305 354h14v12h-14z" class="eq"/><path d="M305 366l14-12" class="tap"/><circle cx="350" cy="360" r="13" class="eq"/><path d="M342 368L363 360L342 352" class="ln"/><path d="M350 347V320" class="shd"/><text x="350" y="314" class="tgs">gear-driven</text><circle cx="350" cy="470" r="13" class="eq"/><path d="M342 478L363 470L342 462" class="ln"/><circle cx="350" cy="496" r="9" class="eq"/><text x="350" y="499" class="it">M</text><text x="390" y="390" class="tgs">main oil pump</text><text x="270" y="492" class="tgs">auxiliary oil pump</text><path d="M363 360H430M363 470H430V360" class="lo"/><path d="M394 354V366L406 360Z" class="vv"/><path d="M406 354V366" class="ln"/><path d="M394 464V476L406 470Z" class="vv"/><path d="M406 464V476" class="ln"/><path d="M430 360V250H520" class="lo"/><path d="M450 250V190H230V300" class="lor" marker-end="url(#c4lo)"/><path d="M333 185L347 195V185L333 195Z" class="vv"/><path d="M340 190V178M333 178a7 7 0 0 1 14 0Z" class="ln"/><text x="340" y="166" class="tgs">PCV-401</text><path d="M520 250H540M540 200V300M540 200H580M540 300H580M620 200H640M620 300H640M640 200V300M640 250H700" class="lo"/><circle cx="600" cy="200" r="18" class="eq"/><path d="M582 200h6l4-8 4 16 4-16 4 8h14" class="ln"/><path d="M594 182V166M606 182V166" class="cwb"/><circle cx="600" cy="300" r="18" class="eq"/><path d="M582 300h6l4-8 4 16 4-16 4 8h14" class="ln"/><path d="M594 282V266M606 282V266" class="cwb"/><text x="600" y="336" class="tgs">twin oil coolers (water)</text><path d="M670 250L670 200" class="tap"/><circle cx="670" cy="200" r="14" class="ib"/><path d="M656 200h28" class="ln"/><text x="670" y="197" class="it">TT</text><text x="670" y="210" class="it">403</text><path d="M700 250H720M720 220V280M720 220H740M720 280H740M764 220H780M764 280H780M780 220V280M780 250H860" class="lo"/><path d="M752 208L764 220L752 232L740 220Z" class="eq"/><path d="M752 208V232" class="tap"/><path d="M752 268L764 280L752 292L740 280Z" class="eq"/><path d="M752 268V292" class="tap"/><text x="752" y="306" class="tgs">twin filters</text><path d="M752 208L752 178" class="tap"/><circle cx="752" cy="178" r="14" class="ib"/><path d="M738 178h28" class="ln"/><text x="752" y="175" class="it">PDI</text><text x="752" y="188" class="it">404</text><path d="M820 250L820 206" class="tap"/><circle cx="820" cy="206" r="14" class="ib"/><path d="M806 206h28" class="ln"/><text x="820" y="203" class="it">PT</text><text x="820" y="216" class="it">405</text><path d="M860 250V470" class="lo"/><path d="M860 300H930" class="lo" marker-end="url(#c4lo)"/><path d="M887 292V308M893 292V308" class="ln"/><text x="934" y="304" class="lbs">BAC gearbox</text><path d="M860 350H930" class="lo" marker-end="url(#c4lo)"/><path d="M887 342V358M893 342V358" class="ln"/><text x="934" y="354" class="lbs">ETB gearbox</text><path d="M860 400H930" class="lo" marker-end="url(#c4lo)"/><path d="M887 392V408M893 392V408" class="ln"/><text x="934" y="404" class="lbs">motor bearings</text><path d="M860 450H930" class="lo" marker-end="url(#c4lo)"/><path d="M887 442V458M893 442V458" class="ln"/><text x="934" y="454" class="lbs">coupling / spare</text><path d="M1080 300V500H120V430" class="lor" marker-end="url(#c4lo)"/><text x="600" y="494" class="lbs">drain return to tank</text><text x="34" y="80" class="lbs">One lube-oil system serves the BAC and the ETB on the common motor. The MAC has its own identical system.</text><rect x="30" y="536" width="600" height="84" class="fr"/><text x="40" y="552" class="lbs">LEGEND</text><path d="M40 574h30" class="lo"/><text x="78" y="578" class="lbs">Lube-oil supply</text><path d="M235 574h30" class="lor"/><text x="273" y="578" class="lbs">Return / spill-back</text><path d="M430 574h30" class="cwb"/><text x="468" y="578" class="lbs">Cooling water</text><path d="M40 600h30" class="vt"/><text x="78" y="604" class="lbs">Vent</text><rect x="700" y="536" width="390" height="84" class="fr"/><path d="M700 586h390M797 586v34M895 586v34M992 586v34" class="fr"/><text x="710" y="556" class="ttl">BAC + ETB — shared lube-oil system</text><text x="710" y="574" class="lbs">Illustrative · own tags · not a project drawing</text><text x="708" y="600" class="zl">DRAWN</text><text x="708" y="614" class="tgl">DD</text><text x="805" y="600" class="zl">SCALE</text><text x="805" y="614" class="tgl">NTS</text><text x="902" y="600" class="zl">SHEET</text><text x="902" y="614" class="tgl">2/2</text><text x="999" y="600" class="zl">REV</text><text x="999" y="614" class="tgl">0</text></svg>