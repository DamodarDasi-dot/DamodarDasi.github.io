</style><desc id="c5l-d">An oil reservoir with heater, level transmitter and motorised demister feeds a shaft-driven main oil pump and a motor-driven auxiliary oil pump through strainers and check valves, with a pressure control valve spilling back to the reservoir and an accumulator to hold pressure on pump changeover. Oil passes twin water-cooled coolers and twin filters to the supply header, which feeds the compressor bearings, gearbox and the turbine lube connection. An overhead rundown tank at least 5 m above the compressor centreline keeps oil flowing to the bearings during coast-down if power is lost. Oil drains back to the reservoir.</desc><defs><marker id="c5la" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22D3EE"/></marker><marker id="c5lb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A5B4FC"/></marker><marker id="c5lo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F59E0B"/></marker><marker id="c5lg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker></defs><rect x="6" y="6" width="1108" height="628" class="fr"/><rect x="20" y="20" width="1080" height="600" class="fr"/><text x="110" y="16" class="zn">1</text><text x="290" y="16" class="zn">2</text><text x="470" y="16" class="zn">3</text><text x="650" y="16" class="zn">4</text><text x="830" y="16" class="zn">5</text><text x="1010" y="16" class="zn">6</text><text x="11" y="95" class="zn">A</text><text x="11" y="245" class="zn">B</text><text x="11" y="395" class="zn">C</text><text x="11" y="545" class="zn">D</text><rect x="60" y="320" width="230" height="120" class="eq"/><text x="175" y="344" class="tg">OIL RESERVOIR</text><path d="M80 420h10l5-9 6 18 6-18 6 18 5-9h10" class="ln"/><text x="186" y="424" class="tg