.pid .sh{stroke:#94A3B8;stroke-width:4}.pid .shd{stroke:#94A3B8;stroke-width:3;stroke-dasharray:4 3}
.pid .tg{fill:#F1F5F9;font:500 11px "IBM Plex Mono",ui-monospace,monospace;text-anchor:middle}.pid .tgs{fill:#CBD5E1;font:400 9.5px "IBM Plex Mono",ui-monospace,monospace;text-anchor:middle}
