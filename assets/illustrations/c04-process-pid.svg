</style><desc id="c4p-d">Two identical three-stage air compressors, MAC and BAC, take air at 0.95 bar(a) and 28.2 °C through inlet filters and silencers, with water injection between stages in the customer scope, and each discharge through their own water-cooled gas cooler, check valve and discharge line at 5.35 bar(a) to the hydrogen-peroxide process. Each has a blow-off and anti-surge valve. The MAC has its own motor; the BAC and the two-stage expander (ETB) share a common motor. Process off-gas returns at 3.42 bar(a) and 372.15 K to the expander and leaves at 1.15 bar(a) and 283.5 K. All machines sit on a common platform.</desc><defs><marker id="c4pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22D3EE"/></marker><marker id="c4pb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A5B4FC"/></marker><marker id="c4po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F59E0B"/></marker><marker id="c4pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker></defs><rect x="6" y="6" width="1108" height="638" class="fr"/><rect x="20" y="20" width="1080" height="610" class="fr"/><text x="110" y="16" class="zn">1</text><text x="290" y="16" class="zn">2</text><text x="470" y="16" class="zn">3</text><text x="650" y="16" class="zn">4</text><text x="830" y="16" class="zn">5</text><text x="1010" y="16" class="zn">6</text><text x="11" y="96" class="zn">A</text><text x="11" y="249" class="zn">B</text><text x="11" y="401" class="zn">C</text><text x="11" y="554" class="zn">D</text><rect x="30" y="34" width="1060" height="470" class="encl"/><text x="40" y="50" class="lbs">COMMON PLATFORM</text><text x="44" y="80" class="lb hi">MAC · MAIN AIR COMPRESSOR</text><path d="M40 150H172" class="pl"/><tex