</style><desc id="pid2-d">Boil-off gas enters at 1.05 bar(a) and −158.3 °C through an isolation valve, strainer and inlet throttle valve, is compressed in a single stage and leaves at 1.67 bar(a) through a check valve and safety valve. An anti-surge recycle valve returns flow to suction. A high-voltage motor drives the compressor through a gearbox. Clean dry nitrogen at a minimum of 4 barg feeds the dry gas seals through twin filters and a pressure control valve. A lube-oil console with main and auxiliary pumps, an air-cooled fan cooler and a filter supplies the gearbox and compressor bearings.</desc><defs><marker id="pb2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A5B4FC"/></marker><marker id="pa2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22D3EE"/></marker></defs><rect x="6" y="6" width="1108" height="628" class="fr"/><rect x="20" y="20" width="1080" height="600" class="fr"/><text x="110" y="16" class="zn">1</text><text x="290" y="16" class="zn">2</text><text x="470" y="16" class="zn">3</text><text x="650" y="16" class="zn">4</text><text x="830" y="16" class="zn">5</text><text x="1010" y="16" class="zn">6</text><text x="11" y="95" class="zn">A</text><text x="11" y="245" class="zn">B</text><text x="11" y="395" class="zn">C</text><text x="11" y="545" class="zn">D</text><path d="M30 100H560V224" class="sg" marker-end="url(#pb2)"/><text x="34" y="58" class="lb sgt">SEAL GAS · CLEAN DRY N₂ · MIN 4 barg</text><path d="M150 88L162 100L150 112L138 100Z" class="eq"/><path d="M150 88V112" class="tap"/><path d="M150 132L162 144L150 156L138 144Z" class="eq"/><path d="M150 132V156" class="tap"/><path d="M126 100V144H138M162 144H174V100" class="sg"/><text x="150" y="168" class="tgs">twin filters</text><path d="M233 95L247 105V95L233 105Z" class="vv"/><path d="M240 100V88M233 88a7 7 0 0 1 14 0Z" class="ln"/><text x="240" y="76" cl