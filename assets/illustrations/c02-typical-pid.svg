<svg xmlns="http://www.w3.org/2000/svg" class="pid" viewBox="0 0 1120 640" role="img" aria-labelledby="pid2-t pid2-d"><title id="pid2-t">Typical P&amp;ID of the BOG compressor package (illustrative)</title><style>.pid{display:block;width:100%;height:auto;background:#071018}
