/text><path d="M666 260L666 212" class="tap"/><circle cx="666" cy="212" r="14" class="ib"/><path d="M652 212h28" class="ln"/><text x="666" y="209" class="it">TT</text><text x="666" y="222" class="it">102</text><path d="M714 254V266L726 260Z" class="vv"/><path d="M726 254V266" class="ln"/><path d="M760 260V246" class="pl"/><path d="M754 246L766 246L760 234Z" class="vv"/><path d="M760 234h12v-8" class="ln"/><text x="752" y="230" class="tgs" text-anchor="end">PSV-101</text><path d="M820 260L820 308" class="tap"/><circle cx="820" cy="308" r="14" class="ib"/><path d="M806 308h28" class="ln"/><text x="820" y="305" class="it">FT</text><text x="820" y="318" class="it">102</text><path d="M1043 255L1057 265V255L1043 265Z" class="vv"/><text x="1084" y="248" class="lb hi" text-anchor="end">BOG DISCHARGE</text><text x="1084" y="282" class="lbs" text-anchor="end">1.67 bar(a) · ≈ −140.9 °C</text><path d="M900 260V170H190V260" class="rc"/><path d="M633 165L647 175V165L633 175Z" class="vv"/><path d="M640 170V158M633 158a7 7 0 0 1 14 0Z" class="ln"/><text x="640" y="146" class="tgs">FV-101</text><text x="200" y="162" class="lbs">ANTI-SURGE RECYCLE</text><circle cx="190" cy="420" r="24" class="eq"/><text x="190" y="425" class="tg">M</text><text x="190" y="462" class="lbs" text-anchor="middle">HV MOTOR</text><path d="M190 396L190 364" class="tap"/><circle cx="190" cy="364" r="14" class="ib"/><path d="M176 364h28" class="ln"/><text x="190" y="361" class="it">TT</text><text x="190" y="374" class="it">401</text><text x="212" y="350" class="lbs">winding / bearing</text><path d="M214 420H470" class="sh"/><rect x="470" y="398" width="136" height="44" class="eq"/><text x="538" y="425" class="tg">GEARBOX</text><path d="M538 294V398" class="shd"/><rect x="690" y="360" width="400" height="130" class="fr"/><text x="700" y="376" class="lbs">LUBE-OIL CONSOLE</text><rect x="710" y="420" width="90" height="50" class="eq"/><text x="755" y="450" class="tgs">reservoir</text><path d="M725 462h6l3-6 4 12 