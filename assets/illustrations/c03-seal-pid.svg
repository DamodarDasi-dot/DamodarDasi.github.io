G compressor — seal-gas P&amp;ID</text><text x="710" y="574" class="lbs">Illustrative · own tags · not a project drawing</text><text x="708" y="600" class="zl">DRAWN</text><text x="708" y="614" class="tgl">DD</text><text x="805" y="600" class="zl">SCALE</text><text x="805" y="614" class="tgl">NTS</text><text x="902" y="600" class="zl">SHEET</text><text x="902" y="614" class="tgl">3/3</text><text x="999" y="600" class="zl">REV</text><text x="999" y="614" class="tgl">0</text></svg>