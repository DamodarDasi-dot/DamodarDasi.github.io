</style><desc id="c3g-d">Process gas taken from compressor discharge, with nitrogen from the customer as backup seal gas at standstill, passes a dual 5-micron filter assembly with differential pressure indication and a pressure control valve to a seal-gas header. The header feeds the dry gas seals of all four stages through orifices with flow transmitters. Primary seal vents from each stage pass orifices and pressure indicators to a common vent to safe area or flare. Nitrogen separation gas at 4 to 6 barg passes a dual filter and pressure control valve to the separation seals.</desc><defs><marker id="c3ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22D3EE"/></marker><marker id="c3gb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A5B4FC"/></marker><marker id="c3go" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F59E0B"/></marker><marker id="c3gg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker></defs><rect x="6" y="6" width="1108" height="628" class="fr"/><rect x="20" y="20" width="1080" height="600" class="fr"/><text x="110" y="16" class="zn">1</text><text x="290" y="16" class="zn">2</text><text x="470" y="16" class="zn">3</text><text x="650" y="16" class="zn">4</text><text x="830" y="16" class="zn">5</text><text x="1010" y="16" class="zn">6</text><text x="11" y="95" class="zn">A</text><text x="11" y="245" class="zn">B</text><text x="11" y="395" class="zn">C</text><text x="11" y="545" class="zn">D</text><text x="34" y="120" class="lb hi">PROCESS SEAL GAS</text><text x="34" y="136" class="lbs">from compressor discharge</text><path d="M30 150H250" class="pl"/><path d="M63 145L77 155V145L63 155Z" class="vv"/><text x="34" y="206" class="lb sgt">BACKUP N₂ · STANDSTILL</t