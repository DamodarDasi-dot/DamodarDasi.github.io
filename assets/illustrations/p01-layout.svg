<svg xmlns="http://www.w3.org/2000/svg" class="ly" viewBox="0 0 1000 560" role="img" aria-labelledby="lyp01-t lyp01-d"><title id="lyp01-t">PSA nitrogen generation train (illustrative)</title><desc id="lyp01-d">Oil-free compressor, aftercooler, moisture separator, pre-filter, desiccant dryer, after-filter, air receiver, twin-tower PSA generator and nitrogen buffer vessel delivering nitrogen to users.</desc><style>
