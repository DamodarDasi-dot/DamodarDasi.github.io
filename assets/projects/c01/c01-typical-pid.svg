<svg xmlns="http://www.w3.org/2000/svg" class="pid" viewBox="0 0 1120 640" role="img" aria-labelledby="pid-t pid-d"><title id="pid-t">Typical P&amp;ID of the N₂ compander package (illustrative)</title><style>.pid{display:block;width:100%;height:auto;background:#071018}
.pid .fr{fill:none;stroke:#2A3D4D;stroke-width:1}.pid .zn{fill:#64748B;font:400 9px "IBM Plex Mono",ui-monospace,monospace;text-anchor:middle}
.pid .eq{fill:#0B1118;stroke:#CBD5E1;stroke-width:1.3}.pid .eq.hi{stroke:#22D3EE}.pid .eq.ex{stroke:#A5B4FC}
.pid .ln{fill:none;stroke:#E2E8F0;stroke-width:1.1}.pid .tap{fill:none;stroke:#64748B;stroke-width:1;stroke-dasharray:3 2}
.pid .vv{fill:#071018;stroke:#E2E8F0;stroke-width:1.1}.pid .ib{fill:#071018;stroke:#38BDF8;stroke-width:1.1}
.pid .pl{fill:none;stroke:#22D3EE;stroke-width:2.2}.pid .pl2{fill:none;stroke:#A5B4FC;stroke-width:2;stroke-dasharray:8 4}
.pid .rc{fill:none;stroke:#22D3EE;stroke-width:1.3;stroke-dasharray:2 4;opacity:.8}
.pid .cw{fill:none;stroke:#34D399;stroke-width:2}.pid .cwr{fill:none;stroke:#34D399;stroke-width:2;stroke-dasharray:9 5}.pid .cwb{fill:none;stroke:#34D399;stroke-width:1.4}
.pid .lo{fill:none;stroke:#F59E0B;stroke-width:1.6;stroke-dasharray:6 3}
.pid .sh{stroke:#94A3B8;stroke-width:4}.pid .shd{stroke:#94A3B8;stroke-width:3;stroke-dasharray:4 3}
