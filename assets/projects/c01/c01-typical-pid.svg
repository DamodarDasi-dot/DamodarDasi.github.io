</style><desc id="pid-d">Nitrogen enters at 7.4 bar(a) through an isolation valve and strainer, is compressed in three stages with water-cooled intercoolers IC-1 and IC-2, cooled in the after cooler AC and discharged at 35.3 bar(a) through a check valve and safety valve. An anti-surge recycle valve returns flow to suction. A motor drives the integral gearbox carrying the three compressor stages and the expander. A cooling-water supply and return header serves both intercoolers, the after cooler, the lube-oil cooler and the motor cooler.</desc><defs><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22D3EE"/></marker><marker id="pb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A5B4FC"/></marker><marker id="pc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34D399"/></marker></defs><rect x="6" y="6" width="1108" height="628" class="fr"/><rect x="20" y="20" width="1080" height="600" class="fr"/><text x="110" y="16" class="zn">1</text><text x="290" y="16" class="zn">2</text><text x="470" y="16" class="zn">3</text><text x="650" y="16" class="zn">4</text><text x="830" y="16" class="zn">5</text><text x="1010" y="16" class="zn">6</text><text x="11" y="95" class="zn">A</text><text x="11" y="245" class="zn">B</text><text x="11" y="395" class="zn">C</text><text x="11" y="545" class="zn">D</text><path d="M30 200H178" class="pl"/><text x="66" y="188" class="lb hi">N₂ SUCTION</text><text x="96" y="222" class="lbs">7.4 bar(a)</text><path d="M63 195L77 205V195L63 205Z" class="vv"/><path d="M93 194h14v12h-14z" class="eq"/><path d="M93 206l14-12" class="tap"/><path d="M140 200L140 144" class="tap"/><circle cx="140" cy="144" r="14" class="ib"/><path d="M126 144h28" class="ln"/><text x="140" y="141" class="it">FT</text><text x="140" y="154" class="it">101</text><