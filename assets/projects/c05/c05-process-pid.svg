</style><desc id="c5p-d">Air at 0.989 bar(a) and 40 °C enters through a filter-silencer house and inlet guide vanes, is compressed in three stages on an integrally geared machine with vertical water-cooled intercoolers after stages 1 and 2, and leaves at 6.013 bar(a) and 91.2 °C through a check valve. A blow-off valve with silencer protects against surge. Cooling water is supplied at 33 °C and 4.5 barg and returns at 43 °C. The gearbox is driven through a coupling by a customer-supplied steam turbine; the scope break is at the compressor-side coupling. The machine sits in an acoustic enclosure.</desc><defs><marker id="c5pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22D3EE"/></marker><marker id="c5pb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A5B4FC"/></marker><marker id="c5po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F59E0B"/></marker><marker id="c5pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker></defs><rect x="6" y="6" width="1108" height="628" class="fr"/><rect x="20" y="20" width="1080" height="600" class="fr"/><text x="110" y="16" class="zn">1</text><text x="290" y="16" class="zn">2</text><text x="470" y="16" class="zn">3</text><text x="650" y="16" class="zn">4</text><text x="830" y="16" class="zn">5</text><text x="1010" y="16" class="zn">6</text><text x="11" y="95" class="zn">A</text><text x="11" y="245" class="zn">B</text><text x="11" y="395" class="zn">C</text><text x="11" y="545" class="zn">D</text><path d="M30 62H1040" class="cw" marker-end="url(#c5pa)"/><text x="70" y="54" class="lb cwt">CWS · 33 °C · 4.5 barg</text><path d="M1040 96H30" class="cwr"/><text x="70" y="112" class="lb cwt">CWR · 43 °C</text><rect x="130" y="150" width="760" heig