</style><desc id="c3p-d">Natural gas at 13.21 bar(a) and 25 °C is compressed in four stages on an integrally geared machine with air-cooled fin-fan intercoolers after stages 1 to 3 and an air-cooled after cooler, leaving at 50.8 bar(a) through a check valve and safety valve. An anti-surge recycle with an air-cooled recycle cooler of five fans returns gas to suction. The package sits inside a ventilated noise hood and the HV motor has its own cooling fans.</desc><defs><marker id="c3pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22D3EE"/></marker><marker id="c3pb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A5B4FC"/></marker><marker id="c3po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F59E0B"/></marker><marker id="c3pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker></defs><rect x="6" y="6" width="1108" height="628" class="fr"/><rect x="20" y="20" width="1080" height="600" class="fr"/><text x="110" y="16" class="zn">1</text><text x="290" y="16" class="zn">2</text><text x="470" y="16" class="zn">3</text><text x="650" y="16" class="zn">4</text><text x="830" y="16" class="zn">5</text><text x="1010" y="16" class="zn">6</text><text x="11" y="95" class="zn">A</text><text x="11" y="245" class="zn">B</text><text x="11" y="395" class="zn">C</text><text x="11" y="545" class="zn">D</text><rect x="150" y="96" width="830" height="342" class="encl"/><text x="160" y="112" class="lbs">NOISE HOOD / ENCLOSURE · 5 ventilation fans</text><path d="M30 220H170" class="pl"/><text x="34" y="190" class="lb hi">NG SUCTION</text><text x="34" y="206" class="lbs">13.21 bar(a) · 25 °C</text><path d="M63 215L77 225V215L63 225Z" class="vv"/><path d="M93 214h14v12h-14z" class="eq"/><path d="M93 226l14-12" class="tap"/><path d="M140 220L140 270" class="tap"/><circle cx="140" cy="270" r="14" class="ib"/><path d="M126 270h28" class="ln"/><text x="140" y="267" class="it">PT</text><text x="140" y="280" class="it">101</text><path d="M175 196L215 207V233L175 244Z" class="eq"/><text x="195" y="224" class="tg">S1</text><path d="M215 220H267" class="pl"/><rect x="267.0" y="208" width="56" height="24" class="eq hi"/><path d="M271.0 220h6l3-7 4 14 4-14 4 14 4-14 3 7h16" class="ln"/><circle cx="295" cy="192" r="11" class="ln"/><path d="M287 192h16M295 184v16" class="ln"/><path d="M295 203V208" class="ln"/><text x="295" y="248" class="tg">IC-1</text><path d="M323 220H375" class="pl"/><path d="M343 220L343 278" class="tap"/><circle cx="343" cy="278" r="14" class="ib"/><path d="M329 278h28" class="ln"/><text x="343" y="275" class="it">TT</text><text x="343" y="288" class="it">112</text><path d="M375 196L415 207V233L375 244Z" class="eq"/><text x="395" y="224" class="tg">S2</text><path d="M415 220H467" class="pl"/><rect x="467.0" y="208" width="56" height="24" class="eq hi"/><path d="M471.0 220h6l3-7 4 14 4-14 4 14 4-14 3 7h16" class="ln"/><circle cx="495" cy="192" r="11" class="ln"/><path d="M487 192h16M495 184v16" class="ln"/><path d="M495 203V208" class="ln"/><text x="495" y="248" class="tg">IC-2</text><path d="M523 220H575" class="pl"/><path d="M543 220L543 278" class="tap"/><circle cx="543" cy="278" r="14" class="ib"/><path d="M529 278h28" class="ln"/><text x="543" y="275" class="it">TT</text><text x="543" y="288" class="it">122</text><path d="M575 196L615 207V233L575 244Z" class="eq"/><text x="595" y="224" class="tg">S3</text><path d="M615 220H667" class="pl"/><rect x="667.0" y="208" width="56" height="24" class="eq hi"/><path d="M671.0 220h6l3-7 4 14 4-14 4 14 4-14 3 7h16" class="ln"/><circle cx="695" cy="192" r="11" class="ln"/><path d="M687 192h16M695 184v16" class="ln"/><path d="M695 203V208" class="ln"/><text x="695" y="248" class="tg">IC-3</text><path d="M723 