<svg xmlns="http://www.w3.org/2000/svg" class="pid" viewBox="0 0 1120 660" role="img" aria-labelledby="pid3-t pid3-d"><title id="pid3-t">Typical P&amp;ID of the 4-stage natural gas compressor package (illustrative)</title><style>.pid{display:block;width:100%;height:auto;background:#071018}
.pid .fr{fill:none;stroke:#2A3D4D;stroke-width:1}.pid .zn{fill:#64748B;font:400 9px "IBM Plex Mono",ui-monospace,monospace;text-anchor:middle}
