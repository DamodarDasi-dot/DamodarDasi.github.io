</style><desc id="pid3-d">Natural gas enters at 13.21 bar(a) and 25 °C, is compressed in four stages on an integrally geared machine with water-cooled intercoolers after stages 1 to 3 and an after cooler after stage 4, and leaves at 50.8 bar(a) through a check valve and safety valve. An anti-surge recycle line with a recycle cooler and control valve returns gas to suction. Cooling-water supply and return headers serve the intercoolers, after cooler, recycle cooler and oil cooler. Nitrogen seal gas at 4 to 6 barg feeds the dry gas seals. The package sits inside a ventilated noise hood; the HV motor has its own air-cooling fans.</desc><defs><marker id="pa3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22D3EE"/></marker><marker id="pb3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A5B4FC"/></marker><marker id="pc3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34D399"/></marker></defs><rect x="6" y="6" width="1108" height="648" class="fr"/><rect x="20" y="20" width="1080" height="620" class="fr"/><text x="110" y="16" class="zn">1</text><text x="290" y="16" class="zn">2</text><text x="470" y="16" class="zn">3</text><text x="650" y="16" class="zn">4</text><text x="830" y="16" class="zn">5</text><text x="1010" y="16" class="zn">6</text><text x="11" y="98" class="zn">A</text><text x="11" y="252" class="zn">B</text><text x="11" y="408" class="zn">C</text><text x="11" y="562" class="zn">D</text><rect x="150" y="150" width="830" height="330" class="encl"/><text x="160" y="166" class="lbs">NOISE HOOD / ENCLOSURE · ventilation fans</text><path d="M30 62H1040" class="cw" marker-end="url(#pc3)"/><text x="70" y="54" class="lb cwt">CWS · COOLING WATER SUPPLY</text><path d="M1040 96H30" class="cwr" marker-end="url(#pc3)"/><text x="70" y="112" class="lb cwt">CWR · COOLING WATER RETURN</text><path d="M380 62L380 34" class="tap"/><circle cx="380" cy="34" r="14" class="ib"/><path d="M366 34h28" class="ln"/><text x="380" y="31" class="it">PT</text><text x="380" y="44" class="it">501</text><path d="M600 96L600 124" class="tap"/><circle cx="600" cy="124" r="14" class="ib"/><path d="M586 124h28" class="ln"/><text x="600" y="121" class="it">TT</text><text x="600" y="134" class="it">502</text><path d="M30 236H170" class="pl"/><text x="34" y="206" class="lb hi">NG SUCTION</text><text x="34" y="222" class="lbs">13.21 bar(a) · 25 °C</text><path d="M63 231L77 241V231L63 241Z" class="vv"/><path d="M93 230h14v12h-14z" class="eq"/><path d="M93 242l14-12" class="tap"/><path d="M140 236L140 286" class="tap"/><circle cx="140" cy="286" r="14" class="ib"/><path d="M126 286h28" class="ln"/><text x="140" y="283" class="it">PT</text><text x="140" y="296" class="it">101</text><path d="M175 212L215 223V249L175 260Z" class="eq"/><text x="195" y="240" class="tg">S1</text><path d="M215 236H277" class="pl"/><circle cx="295" cy="236" r="18" class="eq"/><path d="M277 236h6l4-8 4 16 4-16 4 8h14" class="ln"/><text x="295" y="270" class="tg">IC-1</text><path d="M289 62V218" class="cwb"/><path d="M301 218V96" class="cwb"/><path d="M284 69L294 83H284L294 69Z" class="vv"/><path d="M296 101L306 115H296L306 101Z" class="vv"/><path d="M313 236H375" class="pl"/><path d="M345 236L345 180" class="tap"/><circle cx="345" cy="180" r="14" class="ib"/><path d="M331 180h28" class="ln"/><text x="345" y="177" class="it">TT</text><text x="345" y="190" class="it">112</text><path d="M375 212L415 223V249L375 260Z" class="eq"/><text x="395" y="240" class="tg">S2</text><path d="M415 236H477" class="pl"/><circle cx="495" cy="236" r="18" class="eq"/><path d="M477 236h6l4-8 4 16 4-16 4 8h14" class="ln"/><text x="495" y="270" class="tg">IC-2</text><path d="M489 62V218" class="cwb"/><path d="M501 218V96" class="cwb"/><path d="M484 69L494 83H484L494 69Z" class="vv"/><path d="M496 101L506 115H4