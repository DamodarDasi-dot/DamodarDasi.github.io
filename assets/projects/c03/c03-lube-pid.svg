</style><desc id="c3l-d">An oil reservoir with electric heater, level and temperature transmitters and a motor-driven oil mist eliminator feeds a main oil pump and an auxiliary oil pump through suction strainers and check valves. A pressure control valve spills excess flow back to the reservoir. A three-way temperature control valve sends oil through an air-cooled fin-fan oil cooler with four 25 % fans or around it on a bypass. Dual filters with a transfer valve and differential pressure indication follow, then the supply header with pressure and temperature transmitters feeds bearings A, B and C through orifices, and the gearbox. Oil drains back to the reservoir.</desc><defs><marker id="c3la" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22D3EE"/></marker><marker id="c3lb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A5B4FC"/></marker><marker id="c3lo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F59E0B"/></marker><marker id="c3lg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker></defs><rect x="6" y="6" width="1108" height="628" class="fr"/><rect x="20" y="20" width="1080" height="600" class="fr"/><text x="110" y="16" class="zn">1</text><text x="290" y="16" class="zn">2</text><text x="470" y="16" class="zn">3</text><text x="650" y="16" class="zn">4</text><text x="830" y="16" class="zn">5</text><text x="1010" y="16" class="zn">6</text><text x="11" y="95" class="zn">A</text><text x="11" y="245" class="zn">B</text><text x="11" y="395" class="zn">C</text><text x="11" y="545" class="zn">D</text><rect x="60" y="300" width="220" height="130" class="eq"/><text x="170" y="324" class="tg">OIL RESERVOIR</text><path d="M80 410h10l5-9 6 18 6-18 6 18 5-9h10" class="ln"/><text x=